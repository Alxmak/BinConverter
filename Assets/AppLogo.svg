<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Tweak Firmware">
  <title>Tweak Firmware</title>

  <!--
    Логотип: микросхема с выводами, тёмный экран в светлой рамке, приглашение
    командной строки. Геометрия и цвета сняты измерением с финального растра
    (кромки — по субпиксельному переходу, градиенты — методом наименьших
    квадратов по десяткам тысяч точек), поэтому рисунок повторяет исходник,
    а не нарисован «на глаз».

    Обрезано по самому рисунку: кончики выводов лежат ровно на границах
    viewBox, пустых полей внутри файла нет. Отступ, если понадобится,
    задаётся снаружи — размером элемента.

    Две правки против растра, обе вынужденные и обе не про дизайн:
    • корпус в растре 431x412 (шире, чем выше, на 4%) — здесь квадрат по
      средней стороне: холст иконки квадратный, и такой перекос на нём
      превратился бы либо в поля, либо в растяжение;
    • экран и рамка выровнены по центру корпуса — в растре они были ниже
      на 4px из 412, что рядом с расхождением центров самого корпуса
      и выводов (2.7px) читается как неточность отрисовки.
    Пропорция экрана (шире, чем выше) сохранена: это видимая часть замысла,
    а не погрешность.
  -->
  <defs>
    <!--
      Один градиент на корпус и выводы, в координатах картинки
      (userSpaceOnUse): выводы продолжают корпус без стыка и шва.
      Ось наклонена — светлее у левого верхнего угла, темнее у правого
      нижнего; наклон x/y = 0.266 взят из того же замера.
    -->
    <linearGradient id="tf-chip" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="80.4" y2="302.7">
      <stop offset="0" stop-color="#8DC9F6"/>
      <stop offset="1" stop-color="#4371D2"/>
    </linearGradient>

    <!-- У экрана свой градиент, почти строго вертикальный. -->
    <linearGradient id="tf-screen" gradientUnits="userSpaceOnUse" x1="128" y1="65.6" x2="128" y2="190.4">
      <stop offset="0" stop-color="#2A4778"/>
      <stop offset="1" stop-color="#152C54"/>
    </linearGradient>
  </defs>

  <!-- Выводы: по четыре с каждой стороны, шаг 33.05. Рисуются до корпуса
       и заходят под него, чтобы круглый торец не выглянул у основания. -->
  <g stroke="url(#tf-chip)" stroke-width="9.1" stroke-linecap="round">
    <path d="M78.4 4.55V40M111.5 4.55V40M144.5 4.55V40M177.6 4.55V40"/>
    <path d="M78.4 251.45V216M111.5 251.45V216M144.5 251.45V216M177.6 251.45V216"/>
    <path d="M4.55 78.4H40M4.55 111.5H40M4.55 144.5H40M4.55 177.6H40"/>
    <path d="M251.45 78.4H216M251.45 111.5H216M251.45 144.5H216M251.45 177.6H216"/>
  </g>

  <!-- Корпус -->
  <rect x="30.7" y="30.7" width="194.6" height="194.6" rx="26.8" fill="url(#tf-chip)"/>

  <!-- Рамка экрана: белый с прозрачностью, а не отдельный цвет. В растре она
       ровно белый под 36% в любой точке — так она и остаётся светлее корпуса
       на всём протяжении градиента. -->
  <rect x="50.1" y="58.2" width="155.8" height="139.6" rx="20.8" fill="#FFFFFF" fill-opacity=".36"/>

  <!-- Экран -->
  <rect x="57.6" y="65.6" width="140.8" height="124.8" rx="13.4" fill="url(#tf-screen)"/>

  <!-- Приглашение командной строки: уголок и подчёркивание. Толщина линии
       та же, что у выводов — в исходнике это одно и то же значение. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="9.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M82.3 93.5l34.1 27.7-34.1 27.7"/>
    <path d="M129.8 153.7h28.1"/>
  </g>
</svg>

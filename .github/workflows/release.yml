name: Собрать и опубликовать релиз

on:
  push:
    tags:
      - 'v*.*.*'
  # Второй способ запуска — вручную из вкладки Actions, с указанием версии.
  # Нужен потому, что пуш тега доступен не из любого окружения (а релиз собрать
  # надо всё равно): при таком запуске тег создаёт сам action-gh-release.
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без префикса v, например 2.8.0'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # Про версии действий — то же, что в build-check.yml: они на Node 24, потому
      # что Node 20 выводят из обращения. Здесь это важнее вдвойне: этот прогон
      # запускается раз в релиз, и его поломку видно только в момент выпуска.
      - name: Checkout кода
        uses: actions/checkout@v7

      # Дальше всё считается от одного значения, а не от github.ref_name: при запуске
      # вручную ref_name — это "main", и в имена файлов попало бы оно.
      - name: Определить тег релиза
        id: tag
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "v" + "${{ inputs.version }}".TrimStart('v')
          } else {
            "${{ github.ref_name }}"
          }
          "name=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT
          Write-Host "Релиз: $tag"

      - name: Установить .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Восстановить зависимости
        run: dotnet restore TweakFirmware.csproj

      # PublishReadyToRun компилирует наши сборки заранее, а не JIT'ом по ходу работы.
      # Сборки самой платформы в self-contained и так приходят скомпилированными, а вот
      # TweakFirmware, TweakFirmware.Core и Wpf.Ui (одна она на 6,5 МБ) раньше
      # компилировались на лету и первым проходом — в самом медленном режиме. Именно на
      # это приходилось первое открытие каждого раздела: заметно медленнее последующих.
      # Платой стал размер: exe вырастает, потому что рядом с кодом лежит ещё и машинный.
      - name: Собрать один exe-файл (self-contained, win-x64)
        run: >
          dotnet publish TweakFirmware.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish

      - name: Упаковать в zip (портативная версия)
        run: Compress-Archive -Path ./publish/* -DestinationPath ./TweakFirmware-${{ steps.tag.outputs.name }}-win-x64.zip
        shell: pwsh

      - name: Установить Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Собрать установщик (Inno Setup)
        shell: pwsh
        # choco кладёт "shim" iscc.exe в C:\ProgramData\chocolatey\bin, который уже
        # входит в PATH на GitHub-раннерах — отдельно искать путь к Inno Setup не нужно.
        run: iscc /DMyAppVersion=${{ steps.tag.outputs.version }} installer\Setup.iss

      - name: Создать релиз на GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./TweakFirmware-${{ steps.tag.outputs.name }}-win-x64.zip
            ./installer-output/*.exe
          # Заголовок задаём явно. Без этого он берётся из уже существующего релиза,
          # и если релиз успели создать руками до прогона, название остаётся тем,
          # что набрали вручную (так у 2.7.0 вышло "2.7.0" вместо "v2.7.0").
          # tag_name обязателен: при запуске вручную тега ещё нет, и его создаёт
          # этот шаг. При запуске по тегу значение совпадает с уже существующим.
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Собрать и опубликовать релиз

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Установить .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Восстановить зависимости
        run: dotnet restore TweakFirmware.csproj

      - name: Собрать один exe-файл (self-contained, win-x64)
        run: >
          dotnet publish TweakFirmware.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish

      - name: Упаковать в zip (портативная версия)
        run: Compress-Archive -Path ./publish/* -DestinationPath ./TweakFirmware-${{ github.ref_name }}-win-x64.zip
        shell: pwsh

      - name: Определить версию для установщика
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Установить Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Собрать установщик (Inno Setup)
        shell: pwsh
        # choco кладёт "shim" iscc.exe в C:\ProgramData\chocolatey\bin, который уже
        # входит в PATH на GitHub-раннерах — отдельно искать путь к Inno Setup не нужно.
        run: iscc /DMyAppVersion=${{ steps.version.outputs.value }} installer\Setup.iss

      - name: Создать релиз на GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./TweakFirmware-${{ github.ref_name }}-win-x64.zip
            ./installer-output/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

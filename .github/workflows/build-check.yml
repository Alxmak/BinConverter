name: Проверка сборки

# Релизный workflow срабатывает только на тег, поэтому до него ошибка компиляции
# всплывала уже во время публикации релиза. Этот прогон собирает проект и гоняет
# тесты на каждый пуш в main, чтобы к моменту релиза сборка была заведомо рабочей.
#
# Рабочие ветки проверяются тоже: сборка идёт под Windows, и часть кода — работа
# с путями, компиляция XAML — на другой системе ведёт себя иначе. Знать об этом
# лучше до слияния, а не после.
on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  # позволяет запустить проверку вручную из вкладки Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Установить .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Восстановить зависимости
        run: |
          dotnet restore TweakFirmware.csproj
          dotnet restore TweakFirmware.Tests/TweakFirmware.Tests.csproj

      # Основная цель: XAML компилируется в BAML именно на этом шаге, поэтому
      # опечатки в разметке и несуществующие имена иконок ловятся здесь.
      #
      # -warnaserror: предупреждение здесь роняет прогон. Причина конкретная —
      # у этого шага и у шага тестов свои счётчики предупреждений, и «0 Warning(s)»
      # в конце лога относится к тестам, а не к приложению. Четыре CS8602
      # в ViewModel прожили так несколько прогонов: сборка была зелёной, счётчик
      # в хвосте лога — нулевой, а предупреждения лежали в середине. Проект
      # держится на нуле предупреждений, так пусть это проверяет прогон,
      # а не внимательность читающего лог.
      - name: Собрать приложение (Release)
        run: dotnet build TweakFirmware.csproj -c Release --no-restore -warnaserror

      # Предупреждения тестового проекта тоже роняют прогон, и это не педантизм:
      # у сборки приложения и у сборки тестов свои счётчики, а сюда смотрят реже.
      # Анализатор xUnit ловит осмысленное — например, проверку размера коллекции
      # через Assert.Equal вместо Assert.Single, — и один такой warning уже прожил
      # целый прогон незамеченным, потому что «зелено» относилось к приложению.
      # Свойством, а не флагом -warnaserror: dotnet test разбирает свои аргументы сам,
      # и msbuild-флаг до него может не доехать.
      - name: Прогнать тесты Core
        run: dotnet test TweakFirmware.Tests/TweakFirmware.Tests.csproj -c Release --no-restore --verbosity normal -p:TreatWarningsAsErrors=true
